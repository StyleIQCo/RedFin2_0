global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "redfin-ml-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

# Alerting rules — these would live in a separate file in a real deployment.
rule_files:
  - /etc/prometheus/rules.yml
