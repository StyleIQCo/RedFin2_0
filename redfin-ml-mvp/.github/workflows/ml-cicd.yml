name: ml-cicd

# CI/CD for ML — note the shape differs from a normal app pipeline:
#
#   data/schema unit tests → feature tests → offline train →
#   offline eval gate → container build → shadow deploy → promote
#
# The critical gate is the "offline eval" step: we reject any candidate model
# that regresses against a baseline on a golden holdout. This is what stops
# a bad model from ever reaching production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # nightly retrain on fresh data

env:
  PYTHON_VERSION: "3.11"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install deps
        working-directory: redfin-ml-mvp
        run: pip install -r requirements.txt
      - name: Ruff
        working-directory: redfin-ml-mvp
        run: pip install ruff && ruff check src tests data
      - name: Pytest (fast tests)
        working-directory: redfin-ml-mvp
        run: pytest tests/test_features.py tests/test_drift.py tests/test_ab_router.py tests/test_registry.py

  train-and-eval:
    name: Train + offline eval gate
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install
        working-directory: redfin-ml-mvp
        run: pip install -r requirements.txt
      - name: Generate data + train
        working-directory: redfin-ml-mvp
        run: |
          python -m data.generate --n 20000
          python -m src.avm.train
          python -m src.recommender.train
      - name: End-to-end API test
        working-directory: redfin-ml-mvp
        run: pytest tests/test_api.py -v
      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-registry-${{ github.sha }}
          path: redfin-ml-mvp/registry/models/

  container:
    name: Build + push image
    needs: train-and-eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: redfin-ml-mvp
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  shadow-deploy:
    name: Shadow deploy (staging)
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging (shadow mode)
        run: |
          echo "helm upgrade redfin-ml-api ./charts/redfin-ml-api \
            --set image.tag=${{ github.sha }} \
            --set abRouter.shadow=true \
            --set abRouter.trafficSplit=1.0 \
            --namespace applied-ml-staging"
        # In real infra: kubectl/helm/argocd call here.

  promotion-gate:
    name: Promotion gate (approval)
    needs: shadow-deploy
    runs-on: ubuntu-latest
    environment: production  # protected env — requires human approval
    steps:
      - name: Promote to production
        run: |
          echo "helm upgrade redfin-ml-api ./charts/redfin-ml-api \
            --set image.tag=${{ github.sha }} \
            --set abRouter.shadow=false \
            --set abRouter.trafficSplit=0.10 \
            --namespace applied-ml"
