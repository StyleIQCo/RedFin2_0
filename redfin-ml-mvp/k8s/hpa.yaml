apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redfin-ml-api
  namespace: applied-ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redfin-ml-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    # Custom metric: requests-per-pod. Prefer this over raw CPU for ML serving
    # since GBDT inference is CPU-bound but cheap — RPS is the better signal.
    - type: Pods
      pods:
        metric: { name: redfin_ml_requests_per_second }
        target: { type: AverageValue, averageValue: "120" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # don't thrash on brief dips
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
